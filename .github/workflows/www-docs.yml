name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'www-docs/**'
      - 'docs/**'
      - 'extension/**'
      - 'shared-modules/**'
      - '.github/workflows/www-docs.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    # A draft PR runs nothing (#1188): the self-hosted pool is the only one we have, and the
    # issue-workflow opens every PR as a draft and pushes review commits to it. `ready_for_review`
    # is listed because it is NOT in the default set — without it a PR opened as a draft would
    # never get any checks at all, which is worse than running them too early.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'www-docs/**'
      - 'docs/**'
      - 'extension/**'
      - 'shared-modules/**'
      - '.github/workflows/www-docs.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded run on a BRANCH — only the latest push there needs verifying — but
  # never on `main`. A burst of merges used to destroy the verification of everything it
  # landed on top of: two commits 17 seconds apart both had their run cancelled, and a
  # cancelled run reports as a red X with no failing step and no log, which is
  # indistinguishable from a real failure (#1196). The original reasoning was that finishing
  # stale runs wastes scarce self-hosted slots; that is weaker since the pool moved to
  # dedicated hardware (#1185) and drafts stopped consuming it (#1188). Knowing whether
  # `main` is green is worth the slots.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Docs build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # The workspace root install also pulls the extension's onnxruntime-node.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/npm-ci
      # The VitePress shell (.vitepress/theme + config.mts) is real TypeScript against
      # the shared packages' types, but `vitepress build` only strips types (esbuild) —
      # it verifies nothing. vue-tsc is the check that the theme, the config and the
      # types they import still line up (#1050).
      - run: npm run typecheck -w @kimtos/www-docs
      # Assembles content/ from /docs + each app's booklet (build-content.mjs, a
      # prebuild hook), then builds the VitePress site. The generator asserts that
      # every shipped app has a booklet and vice versa, so an app added without
      # docs fails here rather than going missing from the docs site.
      - run: npm run build -w @kimtos/www-docs
